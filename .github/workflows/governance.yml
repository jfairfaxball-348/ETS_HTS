name: Governance integrity (not mathematics)
on:
  push:
    branches: [main]
  pull_request:
jobs:
  record-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governance records (not mathematical truth)
        run: python scripts/check_scaffold.py
      - name: Adversarial governance tests (not novelty or difficulty)
        run: python -m unittest discover -s tests -v
